version = "0.1.0"
description = "D'Wave scripts"
authors = ["Tomasz Śmierzchalski <tsmierzchalski@iitis.pl>"]
readme = "README.md"
packages = [{include = "d_wave_scripts"}]

[tool.poetry.dependencies]
